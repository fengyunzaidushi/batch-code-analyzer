[package]
name = "batch-code-analyzer-repository-scanner"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "GPL-3.0-only"

[dependencies]
batch-code-analyzer-security-core = { path = "../security-core" }
blake3 = "1.8"
serde = { version = "1.0.228", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
