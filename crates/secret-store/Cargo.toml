[package]
name = "batch-code-analyzer-secret-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "UNLICENSED"

[dependencies]
async-trait = "0.1.89"
keyring = "4.1.5"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
