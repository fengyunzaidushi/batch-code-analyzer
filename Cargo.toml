[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/app-core",
  "crates/domain",
  "crates/ipc-contracts",
  "crates/persistence",
  "crates/repository-scanner",
  "crates/security-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "UNLICENSED"

[workspace.dependencies]
tauri = "=2.11.5"
tauri-build = "=2.6.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread"] }
time = { version = "0.3.44", features = ["formatting"] }
tauri-plugin-dialog = "=2.7.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
