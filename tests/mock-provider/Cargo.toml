[package]
name = "batch-code-analyzer-mock-provider"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "UNLICENSED"

[workspace]

[dependencies]
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
